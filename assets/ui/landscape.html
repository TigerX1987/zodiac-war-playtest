<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>十二星座·四象战争 · 兼容横屏</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1521; }
    iframe { position: absolute; inset: 0; width: 100vw; width: 100dvw; height: 100vh; height: 100dvh; border: 0; }
    @media (orientation: portrait) {
      iframe { inset: auto; top: 0; left: 100vw; left: 100dvw; width: 100vh; width: 100dvh; height: 100vw; height: 100dvw; transform-origin: top left; transform: rotate(90deg); }
    }
    #landscape-loading { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; color: #e8d5a6; background: #0b1521; font-family: sans-serif; text-align: center; }
    #landscape-loading a { display: inline-flex; align-items: center; min-height: 44px; padding: 4px 16px; border: 1px solid #cda75b; border-radius: 4px; color: #ffe0a3; }
  </style>
</head>
<body>
  <main id="landscape-loading" role="status">
    <strong>正在打开兼容横屏…</strong>
    <span>若画面没有显示，请返回后从右上角菜单选择在系统浏览器中打开。</span>
    <a href="/zodiac-war-playtest/">返回普通显示</a>
  </main>
  <iframe id="landscape-game" name="zodiac-landscape-game" src="/zodiac-war-playtest/" title="十二星座游戏横屏界面"></iframe>
  <script src="/zodiac-war-playtest/assets/i18n/game-i18n.js?v=web-9495dc839832ae23"></script>
  <script>
    const frame = document.getElementById('landscape-game');
    frame.addEventListener('load', () => {
      if (frame.contentDocument?.querySelector('main')) document.getElementById('landscape-loading')?.remove();
    });
  </script>
</body>
</html>
