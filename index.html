  <style>

    .sun, .moon { border-color: #92400e; background: #fffbeb; }

    .response { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; padding: 10px; background: #fffbea; border: 1px solid #f0b429; border-radius: 6px; }
    .discardChooser { position: relative; flex-shrink: 0; z-index: 4; flex-wrap: wrap; margin: 0 0 6px; }
    .discardChooser span { flex: 1 1 160px; }
    .discardChooser button { flex: 0 0 auto; }
    .error, .winner { margin-top: 12px; padding: 10px 12px; border-radius: 6px; }
    .error { background: #fff3f3; border: 1px solid #ffbdbd; color: #9b1c1c; }
    .winner { background: #e3fcec; border: 1px solid #8eedb2; color: #0c6b3f; }
    .log { margin-top: 18px; background: #fff; border: 1px solid #d9e2ec; border-radius: 8px; padding: 16px; }
    .log div { padding: 8px 0; border-top: 1px solid #edf2f7; }
    body { background: radial-gradient(circle at 50% -10%, #334e68 0%, #102a43 44%, #0b1020 100%); color: #edf2f7; }
    main { max-width: 1500px; padding: 18px; }
    .top { display: grid; grid-template-columns: minmax(280px, 1fr) auto; align-items: start; padding: 14px; border: 1px solid rgba(188, 204, 220, .22); border-radius: 12px; background: rgba(15, 23, 42, .82); box-shadow: 0 18px 50px rgba(2, 6, 23, .25); }

    .board { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; }
    .arena { min-height: 430px; border-radius: 16px; border: 1px solid rgba(188, 204, 220, .24); background: linear-gradient(180deg, rgba(15,23,42,.94), rgba(30,41,59,.86)); padding: 14px; position: relative; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 20px 60px rgba(2,6,23,.24); }

    .combatant { min-height: 250px; border-radius: 16px; padding: 14px; position: relative; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; border: 1px solid rgba(255,255,255,.2); box-shadow: 0 18px 40px rgba(2,6,23,.28); }

    .hpPips { display: flex; gap: 4px; }
    .pip { width: 18px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.26); }
    .pip.filled { background: #fef3c7; box-shadow: 0 0 12px rgba(254,243,199,.7); }
    .versusLane { display: grid; place-items: center; gap: 10px; color: #fde68a; font-weight: 900; }
    .versusBadge { width: 62px; height: 62px; display: grid; place-items: center; border-radius: 50%; background: rgba(15,23,42,.82); border: 1px solid rgba(253,230,138,.46); font-size: 22px; }
    .attackBeam { width: 100%; height: 8px; border-radius: 999px; background: linear-gradient(90deg, transparent, #fbbf24, transparent); opacity: 0; transform: scaleX(.3); }
    .targetArrow { color: #cbd5e1; font-size: 12px; }
    .arena.animating .attackBeam { animation: beam .7s ease-out; }
    .combatant.hit { animation: hitShake .38s ease-out; }
    #effectLayer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
    .floatText { position: absolute; right: 44px; top: 38%; color: #fff7ed; font-size: 36px; font-weight: 900; text-shadow: 0 4px 20px rgba(127,29,29,.95); animation: floatUp 1.2s ease-out forwards; }
    #dragGuideLayer { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 9999; pointer-events: none; opacity: 0; transition: opacity .08s ease; }
    #dragGuideLayer.active { opacity: 1; }
    #dragGuideLine { stroke: #facc15; stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(250,204,21,.85)); }
    #dragGuideLine.targeting { stroke-dasharray: 10 8; }

    #actionGuideLayer { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 9000; pointer-events: none; opacity: 0; transition: opacity .12s ease; }
    #actionGuideLayer.active { opacity: 1; }

    .stageHand { position: relative; z-index: 1; margin-top: 12px; }

    .sidePanel .hand { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }

    .hand { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 10px; margin-top: 12px; }

    body { background:

    .setupPause {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(760px, 94%);
      margin: 0;
      padding: 18px;
      border: 1px solid rgba(250,204,21,.62);
      border-radius: 8px;
      background: rgba(5,9,16,.94);
      color: #fef3c7;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(230px, .8fr);

      gap: 18px;

      box-shadow: 0 18px 42px rgba(0,0,0,.56), 0 0 32px rgba(250,204,21,.18);

    .openingWheelStage { position: relative; width: min(290px, 100%); aspect-ratio: 1; margin: auto; }
    .openingWheelRing {
      position: absolute;
      inset: 16%;
      border: 2px solid rgba(250,204,21,.46);
      border-radius: 50%;
      background:
        repeating-conic-gradient(from 0deg, rgba(250,204,21,.2) 0deg 1deg, transparent 1deg 45deg),
        radial-gradient(circle, rgba(250,204,21,.12), transparent 62%);
      box-shadow: inset 0 0 28px rgba(250,204,21,.12), 0 0 24px rgba(250,204,21,.1);
      animation: openingWheelSpin 2.2s cubic-bezier(.18,.72,.2,1) both;
    }
    .openingWheelPointer {
      position: absolute;
      z-index: 2;
      left: calc(50% - 2px);
      top: 17%;
      bottom: 50%;
      width: 4px;
      border-radius: 999px;
      transform-origin: 50% 100%;
      transform: rotate(var(--pointer-angle));
      background: linear-gradient(180deg, #fff7c2, #facc15 68%, transparent);
      filter: drop-shadow(0 0 7px rgba(250,204,21,.95));
      animation: openingPointerSpin 2.2s cubic-bezier(.12,.72,.18,1) both;
    }
    .openingWheelPointer::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -4px;
      width: 12px;
      height: 12px;
      transform: translateX(-50%) rotate(45deg);
      background: #fef3c7;
      box-shadow: 0 0 12px rgba(250,204,21,.9);
    }
    .openingWheelSeat {
      position: absolute;
      z-index: 3;

      border: 1px solid rgba(148,163,184,.34);
